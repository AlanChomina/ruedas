<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logotipo de Ruedas">
  <!-- Logo provisional: una rueda (llanta + rin de cinco rayos). Reemplázalo por el logo oficial con el mismo nombre de archivo. -->
  <!-- Llanta -->
  <circle cx="32" cy="32" r="25" fill="#F7F3E9" stroke="#6B8F71" stroke-width="7"/>
  <!-- Rin -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#A7B89F" stroke-width="2.5"/>
  <!-- Rayos -->
  <g stroke="#6B8F71" stroke-width="4.5" stroke-linecap="round">
    <path d="M32 32 L32 16"/>
    <path d="M32 32 L47.2 27.1"/>
    <path d="M32 32 L41.4 44.9"/>
    <path d="M32 32 L22.6 44.9"/>
    <path d="M32 32 L16.8 27.1"/>
  </g>
  <!-- Centro -->
  <circle cx="32" cy="32" r="6.5" fill="#FF8F5A"/>
</svg>
