{# Tarjeta de agencia. Espera una variable "agencia". #}
<article class="tarjeta p-4 h-100">
  <div class="d-flex align-items-center gap-3 mb-3">
    <span class="icono-circulo"><i class="bi bi-buildings"></i></span>
    <div>
      <h3 class="h6 mb-1">{{ agencia.nombre }}</h3>
      {% if agencia.verificado %}
        <span class="insignia insignia-verificado"><i class="bi bi-patch-check-fill"></i> Agencia verificada</span>
      {% else %}
        <span class="insignia insignia-pendiente"><i class="bi bi-clock"></i> Pendiente de verificación</span>
      {% endif %}
    </div>
  </div>
  <p class="small texto-suave">{{ agencia.descripcion }}</p>
  <p class="small mb-0"><i class="bi bi-geo-alt text-salvia"></i> {{ agencia.zona }}{% if agencia.carros is not none %} · <i class="bi bi-car-front text-naranja"></i> {{ agencia.carros }} carros{% endif %}</p>
</article>
